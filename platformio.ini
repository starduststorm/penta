; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = v2

[env]
framework = arduino
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.filesystem_size = 0.5m
board = rpipico
board_build.arduino.earlephilhower.usb_manufacturer = "starduststorm"
board_build.arduino.earlephilhower.usb_product = "penta"
lib_deps = 
	FastLED/FastLED@3.10.3

; custom_release_hw: board revisions an env's build is published for. .github/workflows/firmware.yml builds every env
; that has one and uploads its UF2 once per revision as penta-<version>-hw<rev>.uf2; the Newer Glow updater picks the
; asset matching the device's IDENTIFY hw=, so each revision here must be one the firmware reports at runtime.

[env:v2] # MakerFaire 2025 hardware
custom_release_hw = 2
extra_scripts =
	pre:scripts/build_epoch.py
	pre:lib/dustlib/scripts/fw_version.py
build_flags = 
	-std=c++20 -DKISSFFT_DATATYPE=int16_t -DFIXED_POINT=1 -DHARDWARE_VERSION=2
